site_name: Business & Management 101
site_url: https://businessmanagement101.github.io
theme:
  name: material
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/account-group-outline
  favicon: assets/images/groups_2.png
  features:
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - navigation.tabs
    - navigation.path
    - navigation.expand
    - navigation.indexes
    - navigation.tracking
    - navigation.footer
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    # - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight

copyright: Copyright &copy; 2025 Midhubalan Balasubramanian
repo_url: https://github.com/businessmanagement101/businessmanagement101.github.io
repo_name: businessmanagement101/businessmanagement101.github.io
extra:
  generator: true
  social:
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/midhubalan
    - icon: fontawesome/brands/github-alt
      link: https://github.com/midhubalan 

  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
        #primary: indigo
        #accent: indigo

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
        #primary: indigo
        #accent: indigo

plugins:
  - tags
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - custom-skip-class-name
      auto_caption: false
      caption_position: bottom
      background: white
      shadow: true
      manual: false
      
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - abbr
  - attr_list
  - pymdownx.blocks.caption
# Emoji config
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
# Mermaid markdown config for diagrams
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
# Code block display config
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # Tabbed content
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  # Formatting text
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  # MathJax
  - pymdownx.arithmatex:
      generic: true
nav:
  - Home: index.md
  - Syllabus: 
    - syllabus/index.md
    - Course Description: syllabus/course-description.md
    - Course Materials: syllabus/course-materials.md
    - Grading & Evaluation: syllabus/grading.md
    - Concept Map Guide: syllabus/concept-map-guide.md
    - Company Analysis Guide: syllabus/company-analysis-guide.md
    - Schedule: syllabus/schedule.md
    - AI Policy: syllabus/ai-policy.md
    - Teaching Philosophy: syllabus/teaching-philosophy.md
    - Course Policies: syllabus/course-policies.md
  - Getting Started:
    - getting-started/index.md
    - Concept Map:
      - getting-started/concept-map/index.md
      - Introduction: getting-started/concept-map/intro.md
      - Anatomy of Concept Map: getting-started/concept-map/anatomy.md
      - Focus Question Strategies: getting-started/concept-map/focus-question.md
      - "Workshop: Part - I": getting-started/concept-map/workshop-1.md
      - "Workshop: Part - II": getting-started/concept-map/workshop-2.md
      - Tips & Best Practices: getting-started/concept-map/tips.md
      - Conclusions & Next Steps: getting-started/concept-map/next-steps.md
    - Research with AI:
      - getting-started/research-with-ai/index.md 
      - Working with AI: getting-started/research-with-ai/working-with-ai.md
      - Writing Good Prompts: getting-started/research-with-ai/prompting.md
      - Analysis with NotebookLM: getting-started/research-with-ai/notebooklm-activity.md
      - "Gemini: AI Collaborator" : getting-started/research-with-ai/gemini-activity.md
      - AI Best Practices: getting-started/research-with-ai/best-practices.md
      - Conclusion & Next Steps: getting-started/research-with-ai/next-steps.md


  - Foundations:
    - foundations/index.md
  - Business Functions:
    - business-functions/index.md    
  - Experiential Learning:
    - experiential-learning/index.md  
    